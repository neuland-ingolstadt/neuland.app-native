# PoC: Android Maestro E2E on GitHub Actions.
# Temporary trigger: every pull_request (so this PR actually runs).
# TODO: tighten to opt-in only (workflow_dispatch + label `e2e` / `e2e-android`),
# matching maestro-web.yml.
#
# Two stages: build restores or compiles a debug APK (fingerprint-keyed
# actions/cache), uploads it as a GHA artifact; test installs it and runs Maestro.
name: Maestro Android E2E

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: maestro-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_THI_API_KEY: ${{ secrets.EXPO_PUBLIC_THI_API_KEY }}
  EXPO_PUBLIC_NEULAND_AUTHENTIK_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_NEULAND_AUTHENTIK_CLIENT_ID }}
  EXPO_PUBLIC_NEULAND_GRAPHQL_ENDPOINT: ${{ vars.GRAPHQL_ENDPOINT_DEV }}
  EXPO_PUBLIC_APTABASE_KEY: ${{ secrets.EXPO_PUBLIC_APTABASE_KEY }}
  EXPO_PUBLIC_FLIPT_URL: https://flipt.neuland.ing
  EXPO_PUBLIC_FLIPT_NAMESPACE: neuland-app
  EXPO_PUBLIC_GIT_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Compute native fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          HASH="$(bunx --bun @expo/fingerprint fingerprint:generate --platform android | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).hash)')"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "android fingerprint=$HASH"

      - name: Restore cached debug APK
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: artifacts/neuland-debug.apk
          key: maestro-android-apk-${{ runner.os }}-${{ steps.fingerprint.outputs.hash }}

      - name: Prepare Android project
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/android-prepare

      - name: Compile debug APK
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage debug APK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo 'No debug APK found under android/app/build/outputs/apk' >&2
            find android/app/build/outputs -maxdepth 4 >&2 || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/neuland-debug.apk
          ls -lh artifacts/neuland-debug.apk

      - name: Save debug APK cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: artifacts/neuland-debug.apk
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-apk
          path: artifacts/neuland-debug.apk
          if-no-files-found: error
          retention-days: 7

  test-android:
    name: Maestro Android suite
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Download debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maestro-android-apk
          path: artifacts

      - name: Install Maestro CLI
        run: |
          curl -fsSL --retry 3 --retry-all-errors 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          MAESTRO_ANDROID_APK: ${{ github.workspace }}/artifacts/neuland-debug.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Must be a single line: the action splits multiline scripts and runs
          # each line as its own `sh -c` (breaks if/for/fi).
          script: bash config/ci/run-maestro-android-emulator.sh

      - name: Upload Maestro artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-${{ github.run_id }}
          path: |
            ~/.maestro/tests
            /tmp/maestro-android-metro.log
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
