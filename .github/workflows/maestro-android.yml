# PoC: Android Maestro E2E on GitHub Actions.
# Temporary trigger: every pull_request (so this PR actually runs).
# TODO: tighten to opt-in only (workflow_dispatch + label `e2e` / `e2e-android`),
# matching maestro-web.yml.
#
# Build cache: @eggl-js/expo-github-cache → neuland-ingolstadt/neuland.app-build-cache
# Requires repo secret BUILD_CACHE_GITHUB_TOKEN (fine-grained PAT with Contents
# read+write on neuland.app-build-cache only). On fingerprint hit, expo run:android
# downloads the debug APK; on miss it builds and uploads a new release.
name: Maestro Android E2E

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: maestro-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_THI_API_KEY: ${{ secrets.EXPO_PUBLIC_THI_API_KEY }}
  EXPO_PUBLIC_NEULAND_AUTHENTIK_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_NEULAND_AUTHENTIK_CLIENT_ID }}
  EXPO_PUBLIC_NEULAND_GRAPHQL_ENDPOINT: ${{ vars.GRAPHQL_ENDPOINT_DEV }}
  EXPO_PUBLIC_APTABASE_KEY: ${{ secrets.EXPO_PUBLIC_APTABASE_KEY }}
  EXPO_PUBLIC_FLIPT_URL: https://flipt.neuland.ing
  EXPO_PUBLIC_FLIPT_NAMESPACE: neuland-app
  EXPO_PUBLIC_GIT_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  maestro-android:
    name: Maestro Android suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Require build-cache token
        env:
          BUILD_CACHE_GITHUB_TOKEN: ${{ secrets.BUILD_CACHE_GITHUB_TOKEN }}
        run: |
          if [ -z "$BUILD_CACHE_GITHUB_TOKEN" ]; then
            echo 'Missing secret BUILD_CACHE_GITHUB_TOKEN.' >&2
            echo 'Create a fine-grained PAT with Contents read+write on neuland.app-build-cache only,' >&2
            echo 'then add it as a repository secret named BUILD_CACHE_GITHUB_TOKEN.' >&2
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ./.github/actions/android-prepare

      - name: Log native fingerprint
        run: |
          HASH="$(bunx --bun @expo/fingerprint fingerprint:generate --platform android | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).hash)')"
          echo "android fingerprint=$HASH"
          echo "cache tag=fingerprint.${HASH}.dev-client.android"

      - name: Install Maestro CLI
        run: |
          curl -fsSL --retry 3 --retry-all-errors 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # Override Actions' default GITHUB_TOKEN so @eggl-js/expo-github-cache
          # can read+write releases on the private neuland.app-build-cache repo.
          GITHUB_TOKEN: ${{ secrets.BUILD_CACHE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.BUILD_CACHE_GITHUB_TOKEN }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Must be a single line: the action splits multiline scripts and runs
          # each line as its own `sh -c` (breaks if/for/fi).
          script: bash config/ci/run-maestro-android-emulator.sh

      - name: Upload Maestro artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-android-${{ github.run_id }}
          path: |
            ~/.maestro/tests
            /tmp/maestro-android-metro.log
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
