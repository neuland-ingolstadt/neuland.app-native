name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "19 20 * * 3"

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changes
        uses: $/.github/actions/detect-changes
        id: detect

      # Job-level `if` cannot reference `matrix`; build the include list here instead.
      - name: Build analysis matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_CHANGED: ${{ steps.detect.outputs.code }}
          WORKFLOWS_CHANGED: ${{ steps.detect.outputs.workflows }}
        run: |
          include='[]'
          if [ "$EVENT_NAME" != "pull_request" ]; then
            include='[{"language":"javascript-typescript","build-mode":"none"},{"language":"actions","build-mode":"none"}]'
          else
            if [ "$CODE_CHANGED" = "true" ] || [ "$WORKFLOWS_CHANGED" = "true" ]; then
              include=$(jq -c '. + [{"language":"javascript-typescript","build-mode":"none"}]' <<<"$include")
            fi
            if [ "$WORKFLOWS_CHANGED" = "true" ]; then
              include=$(jq -c '. + [{"language":"actions","build-mode":"none"}]' <<<"$include")
            fi
          fi
          echo "matrix=$(jq -cn --argjson include "$include" '{include:$include}')" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: fromJSON(needs.changes.outputs.matrix).include[0] != null
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{matrix.language}}"
