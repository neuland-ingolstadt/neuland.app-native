name: Prepare Android project
description: License bundle, Expo prebuild, JDK 17 with Gradle cache, and Android SDK
runs:
  using: composite
  steps:
    - name: Update license list
      shell: bash
      run: bun run licences:bundle

    - name: Generate native Android project
      shell: bash
      run: bun run prebuild:android

    - name: Set up JDK 17
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: zulu
        java-version: '17'
        cache: gradle
        cache-dependency-path: android/**/build.gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
