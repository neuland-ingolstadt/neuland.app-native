name: Setup EAS CLI
description: Install Expo Application Services CLI with repository token
inputs:
  token:
    description: Expo access token
    required: true
runs:
  using: composite
  steps:
    - name: Setup Expo and EAS
      uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
      with:
        eas-version: latest
        token: ${{ inputs.token }}
