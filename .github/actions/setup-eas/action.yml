name: Setup EAS CLI
description: Install Expo Application Services CLI with repository token
inputs:
  token:
    description: Expo access token
    required: true
runs:
  using: composite
  steps:
    - name: Setup Expo and EAS
      uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # 9.0.2
      with:
        eas-version: latest
        token: ${{ inputs.token }}
