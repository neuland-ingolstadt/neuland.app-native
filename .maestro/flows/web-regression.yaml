url: ${WEB_URL}
name: web-regression
tags:
  - regression
  - web
  - map
  - navigation
---
- openLink: "${WEB_URL}/onboarding"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "onboarding-continue"
    timeout: 30000
- assertVisible: ".*(Alles an einem Ort|Everything in one place).*"
- assertVisible: ".*(Von Studierenden für Studierende|By students for students).*"
- assertVisible: ".*(Weit verbreitet und vertrauenswürdig|Widely used and trustworthy).*"
- tapOn:
    id: "onboarding-continue"
    retryTapIfNoChange: true
- runFlow:
    when:
      visible:
        id: "onboarding-continue"
    commands:
      # The web accessibility tree does not expose the Reanimated-enabled
      # state. Retry after the intro has had time to enable the real button.
      - tapOn:
          id: "onboarding-continue"
          retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "login-guest"
    timeout: 120000
# Do not center: Maestro web treats the already-visible guest link as gone
# after a centering scroll (100% visibility + centerElement).
- scrollUntilVisible:
    element:
      id: "login-guest"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 40
    centerElement: false
- tapOn:
    id: "login-guest"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- openLink: "${WEB_URL}/map"
- extendedWaitUntil:
    visible:
      id: "map-screen"
    timeout: 30000
- assertVisible:
    id: "map-canvas"
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "Zoom in"
- tapOn:
    id: "Zoom out"
- swipe:
    start: "70%, 35%"
    end: "30%, 35%"
    duration: 700
# On web, Maestro maps accessibilityLabel → resource-id (not visible text).
- tapOn:
    id: "(Floor picker|Etagenauswahl)"
- extendedWaitUntil:
    visible:
      id: "-1"
    timeout: 10000
- tapOn:
    id: "-1"
- tapOn:
    id: "map-search-input"
- inputText: "B106"
- extendedWaitUntil:
    visible: "B106"
    timeout: 15000
- tapOn:
    id: "map-search-result-B106"
- assertVisible:
    id: "map-room-detail"
- assertVisible: "B106"
# Room detail Close exposes accessibilityLabel ("Close"), which collides with
# the floor-picker Close control — just leave via navigation.
- openLink: "${WEB_URL}/food"
- extendedWaitUntil:
    visible:
      id: "food-screen"
    timeout: 20000
- assertVisible:
    id: "food-day-0"
- runFlow:
    when:
      visible:
        id: "food-day-1"
    commands:
      - tapOn:
          id: "food-day-1"
      - assertVisible:
          id: "food-day-1"
- tapOn: "(Food Preferences|Essenspräferenzen)"
- extendedWaitUntil:
    visible:
      id: "multi-option-Reimanns"
    timeout: 10000
- openLink: "${WEB_URL}/settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- assertVisible:
    id: "guest-login-banner"
- openLink: "${WEB_URL}/this-route-must-not-exist"
- assertVisible: ".*(Not found|Nicht gefunden).*"
