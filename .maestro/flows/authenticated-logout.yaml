appId: ${APP_ID}
name: authenticated-logout
tags:
  - authenticated
  - destructive-auth
  - secure-storage
---
# Credentials are supplied to the reusable login sub-flow at runtime. This flow
# deletes the account's saved credentials, so use a disposable test account.
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: "../subflows/reconnect-development-client.yaml"
- runFlow:
    file: "../subflows/login-as-test-account.yaml"
- runFlow:
    file: "../subflows/open-deep-link.yaml"
    env:
      LINK: "neuland://profile"
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "profile-logout"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "profile-logout"
- assertVisible: "(Confirm|Bestätigen)"
- tapOn: "(Cancel|Abbrechen)"
- assertVisible:
    id: "profile-screen"
- tapOn:
    id: "profile-logout"
- tapOn: "(Logout|Abmelden)"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "home-screen"
- runFlow:
    file: "../subflows/open-deep-link.yaml"
    env:
      LINK: "neuland://settings"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 10000
- assertVisible:
    id: "guest-login-banner"
