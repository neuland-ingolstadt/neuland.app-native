appId: ${APP_ID}
name: member-wallet-cancel
tags:
  - regression
  - authenticated
  - member
  - wallet
  - native-module
---
# Precondition: the device has a persisted Neuland member login.
- launchApp:
    clearState: false
    stopApp: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: "../subflows/reconnect-development-client.yaml"
- runFlow:
    file: "../subflows/open-deep-link.yaml"
    env:
      LINK: "neuland://settings"
- extendedWaitUntil:
    visible:
      id: "member-area-entry"
    timeout: 15000
- tapOn:
    id: "member-area-entry"
- extendedWaitUntil:
    visible:
      id: "member-screen"
    timeout: 15000
- scroll
- scroll
- extendedWaitUntil:
    visible: ".*(Add to Wallet|Zu Wallet hinzufügen).*"
    timeout: 10000
- tapOn: ".*(Add to Wallet|Zu Wallet hinzufügen).*"
- extendedWaitUntil:
    visible:
      text: ".*(Your wallet pass|Dein Wallet-Pass).*"
    timeout: 10000
- assertVisible: ".*(Your wallet pass|Dein Wallet-Pass).*"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "wallet-cancel"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ".*(Not now|Abbrechen).*"
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible:
          id: "wallet-security-modal"
- runFlow:
    when:
      platform: iOS
    commands:
      - assertNotVisible: ".*(Your wallet pass|Dein Wallet-Pass).*"
- assertVisible:
    id: "member-screen"
