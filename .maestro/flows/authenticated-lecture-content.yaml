appId: ${APP_ID}
name: authenticated-lecture-content
tags:
  - authenticated
  - seeded-data
  - native-module
---
# Credentials are supplied to the reusable login sub-flow at runtime.
- launchApp:
    clearState: true
    stopApp: true
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: "../subflows/reconnect-development-client.yaml"
- runFlow:
    file: "../subflows/login-as-test-account.yaml"
- runFlow:
    file: "../subflows/open-deep-link.yaml"
    env:
      LINK: "neuland://timetable-preferences"
- extendedWaitUntil:
    visible:
      id: "timetable-preferences-screen"
    timeout: 10000
- tapOn:
    id: "radio-option-timeline-3"
- tapOn:
    id: "timetable-list-mode"
- runFlow:
    file: "../subflows/open-deep-link.yaml"
    env:
      LINK: "neuland://timetable"
- runFlow:
    when:
      visible: ".*(Stundenplan nicht konfiguriert|Timetable not configured).*"
    commands:
      - assertVisible: ".*(Stundenplan nicht konfiguriert|Timetable not configured).*"
      - assertVisible: ".*(Aktualisieren|Refresh).*"
- runFlow:
    when:
      notVisible: ".*(Stundenplan nicht konfiguriert|Timetable not configured).*"
    commands:
      # Timetable list entries expose no testIDs, and the iOS status-bar clock
      # always matches an HH:mm text search, so entries cannot be located by
      # their time label. The list is guarded by its section headers (dayjs is
      # hardcoded to the 'de' locale) and a fixed point inside the list area is
      # tapped. Only lectures have lecture content; exams and calendar events
      # are recognized by their detail screen and left again without checks.
      - extendedWaitUntil:
          visible: "(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag)"
          timeout: 20000
      - tapOn:
          point: "50%, 45%"
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible:
              id: "lecture-details-screen"
          commands:
            - scrollUntilVisible:
                element: "(Goal|Ziel|Content|Inhalt|Literature|Literatur)"
                direction: DOWN
                timeout: 10000
            - tapOn: "(Goal|Ziel|Content|Inhalt|Literature|Literatur)"
            - extendedWaitUntil:
                visible:
                  id: "lecture-webview-screen"
                timeout: 10000
            - scroll
      - runFlow:
          when:
            visible: "(Exam Details|Prüfungsdetails)"
          commands:
            - runFlow:
                file: "../subflows/navigate-back.yaml"
      - runFlow:
          when:
            visible:
              id: "calendar-screen"
          commands:
            - runFlow:
                file: "../subflows/navigate-back.yaml"
