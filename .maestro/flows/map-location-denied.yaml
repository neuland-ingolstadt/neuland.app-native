appId: ${APP_ID}
name: map-location-denied
tags:
  - regression
  - guest
  - map
  - permissions
---
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      notifications: deny
      location: never
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: "../subflows/reconnect-development-client.yaml"
- runFlow:
    file: "../subflows/complete-onboarding-as-guest.yaml"
- runFlow:
    file: "../subflows/open-map-tab.yaml"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "map-current-location"
      - waitForAnimationToEnd:
          timeout: 3000
      - assertVisible:
          id: "map-screen"
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: "map-screen"
      - assertVisible:
          id: "map-search-input"
- stopApp
- launchApp:
    clearState: false
    stopApp: false
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: "../subflows/reconnect-development-client.yaml"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- runFlow:
    file: "../subflows/open-map-tab.yaml"
- assertVisible:
    id: "map-search-input"
