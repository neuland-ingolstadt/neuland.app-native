appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
      visible: ".*Development Build.*"
    commands:
      - openLink: ${DEV_CLIENT_URL}
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - runFlow:
          when:
            visible: "Enter URL manually"
          commands:
            - tapOn: "Enter URL manually"
            - eraseText
            - inputText: ${DEV_SERVER_ADDRESS}
            - pressKey: ENTER
            - runFlow:
                when:
                  visible: "Connect"
                commands:
                  - tapOn: "Connect"
      - tapOn:
          text: "(Open|Öffnen)"
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
      - runFlow:
          when:
            visible:
              id: "xmark"
          commands:
            - tapOn:
                id: "xmark"
- repeat:
    times: 3
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - runFlow:
          when:
            platform: Android
            visible: "http://10.0.2.2:8081"
          commands:
            - tapOn: "http://10.0.2.2:8081"
      - runFlow:
          when:
            platform: Android
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - runFlow:
          when:
            platform: Android
            visible: "Reload"
          commands:
            - tapOn: "Reload"
- runFlow:
    when:
      platform: Android
      notVisible:
        id: "onboarding-continue|login-guest|.*-screen"
    commands:
      - launchApp:
          clearState: false
          stopApp: false
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      platform: Android
      visible: "http://10.0.2.2:8081"
    commands:
      - tapOn: "http://10.0.2.2:8081"
- repeat:
    times: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 10000
      - runFlow:
          when:
            platform: Android
            visible: "Continue"
          commands:
            - tapOn: "Continue"
      - runFlow:
          when:
            platform: Android
            visible: "Reload"
          commands:
            - tapOn: "Reload"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: "onboarding-continue|login-guest|.*-screen"
          timeout: 120000
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
