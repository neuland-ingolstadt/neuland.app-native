appId: ${APP_ID}
---
- openLink: ${DEV_CLIENT_URL}
- waitForAnimationToEnd:
    timeout: 10000
- runFlow:
    when:
      platform: Android
      visible: "http://${DEV_SERVER_ADDRESS}"
    commands:
      - tapOn: "http://${DEV_SERVER_ADDRESS}"
- runFlow:
    when:
      platform: Android
      visible: "Reload"
    commands:
      - tapOn: "Reload"
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible:
        id: "xmark"
    commands:
      - tapOn:
          id: "xmark"
- runFlow:
    when:
      platform: Android
      visible: "Close"
    commands:
      - tapOn: "Close"
