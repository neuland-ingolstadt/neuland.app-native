# bunfig.toml
[install]
# Only install package versions published at least 3 days ago
minimumReleaseAge = 259200
# First-party npmjs packages — safe immediately after Trusted Publishing
# expo-app-intents: alpha SDK 58 package; releases often land inside the 3-day window
minimumReleaseAgeExcludes = [
	"@neuland-ingolstadt/backend-core-api",
	"expo-app-intents"
]

[test]
preload = ["./src/utils/tests/setup.ts"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
	"src/__generated__/**",
	"src/data/licenses.json",
	"src/app/**",
	"src/components/**",
	"src/hooks/**",
	"src/assets/**",
	"src/utils/tests/**",
	"src/api/thi-api.ts",
	"src/api/thi-authenticated-api.ts",
	"ios/**",
	"android/**"
]
