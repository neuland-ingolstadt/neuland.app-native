sonar.organization=neuland-ingolstadt
sonar.projectKey=neuland-ingolstadt_neuland.app-native
sonar.projectName=neuland.app-native

sonar.sources=src
sonar.tests=src/utils/tests
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=src/assets/**,src/data/licenses.json,src/data/package-licenses.json,src/uniwind-types.d.ts

# Thin HTTP clients cannot be unit-tested alongside sticky Bun mock.module
# without poisoning session and consumer suites.
sonar.coverage.exclusions=src/assets/**,src/app/**,src/components/**,src/hooks/**,src/data/licenses.json,src/utils/tests/**,src/api/thi-api.ts,src/api/thi-authenticated-api.ts,src/api/neuland-api.ts,src/api/neuland-core-api.ts,src/api/neuland-food-api.ts,src/api/openapi-utils.ts,src/api/feedback-api.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
