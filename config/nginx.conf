server {
    listen 3000;
    server_name host.docker.internal;

    root /usr/share/nginx/html;
    index index.html;

    # nginx's default mime.types has no .mjs mapping, so MapLibre's v6 worker
    # would be served as application/octet-stream and the browser would reject it.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Expo web ships external scripts only; RN Web / Uniwind need inline styles.
    # connect-src lists first-party + THI APIs; img-src allows https: for CMS/news images.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.neuland.app https://assets.neuland.app https://hiplan.thi.de https://analytics.neuland.app https://flipt.neuland.ing https://survey.neuland.app https://tile.neuland.app https://status.neuland.ing https://auth.neuland.ing https://id.neuland-ingolstadt.de https://cl.neuland-ingolstadt.de https://office-presence-api.neuland.app; worker-src 'self' blob:; frame-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;

    location /.well-known/apple-app-site-association {
        root /usr/share/nginx/html;
        default_type application/json;
    }

    location /.well-known/assetlinks.json {
        root /usr/share/nginx/html;
        default_type application/json;
    }

    location = /.well-known/security.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
    }

    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
